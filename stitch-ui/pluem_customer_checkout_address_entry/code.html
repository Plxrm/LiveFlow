<body class="bg-background text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- Top AppBar (from JSON) -->
<header class="w-full top-0 sticky z-50 bg-surface-container-lowest dark:bg-surface-dim border-b border-outline-variant dark:border-outline shadow-sm">
<div class="flex justify-between items-center h-16 px-lg max-w-[480px] mx-auto">
<div class="flex items-center gap-md">
<button class="cursor-pointer active:scale-95 text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low transition-colors p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Pluem Admin</h1>
</div>
<div class="cursor-pointer active:scale-95 w-10 h-10 rounded-full overflow-hidden border border-outline-variant">
<img alt="Profile" data-alt="A professional close-up of a store manager portrait icon, set against a clean studio background with soft lighting. The visual style is minimalist and high-end, using a palette of soft blues and crisp whites to match a modern corporate dashboard aesthetic. The mood is reliable and efficient." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAxVQ1mzSoddjKNlm9JwAtUfAXo-GNPAVgKkQi7GaYHWj9b62cVh6vMiSFKaajS6zAAObMnFhx5COKeS8256rYYl7L8ODaakOJhnqhxNe3aJ0OcM5Y7cFgnIoTRPJqU7GBW1f05rnuay593aXUv1K6njlLkOkMAj390RxaEibA2sTN1CjfpXkJmVm-uwrBE9qBKuIbTjSjwEZ98X-j8WmxgudygB-umUKKtOThdUDFCKVWbAaNtQQwU4UXYVa2grppMOXm2zIKDslw"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="max-w-[480px] mx-auto px-md pt-md pb-32 min-h-screen">
<!-- Step Indicator / Horizontal Stepper -->
<section class="mb-lg">
<div class="flex justify-between items-start w-full relative">
<!-- Stepper Progress Line -->
<div class="absolute top-4 left-0 w-full h-[2px] bg-surface-container-high -z-10">
<div class="h-full bg-primary-container transition-all duration-500" style="width: 33%;"></div>
</div>
<!-- Step 1: Box Selection (Done) -->
<div class="flex flex-col items-center gap-xs flex-1">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[18px]" data-icon="check" data-weight="fill">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">เลือกกล่อง</span>
</div>
<!-- Step 2: Address Entry (Active) -->
<div class="flex flex-col items-center gap-xs flex-1">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center ring-4 ring-primary-container/20 shadow-md">
<span class="material-symbols-outlined text-[18px]" data-icon="location_on" data-weight="fill">location_on</span>
</div>
<span class="font-label-sm text-label-sm text-primary font-bold">กรอกที่อยู่</span>
</div>
<!-- Step 3: Confirmation (Pending) -->
<div class="flex flex-col items-center gap-xs flex-1">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[18px]" data-icon="check_circle">check_circle</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">ยืนยัน</span>
</div>
<!-- Step 4: Payment (Pending) -->
<div class="flex flex-col items-center gap-xs flex-1">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[18px]" data-icon="payments">payments</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">ชำระเงิน</span>
</div>
</div>
</section>
<!-- Form Card -->
<section class="glass-card rounded-xl shadow-lg p-lg border border-outline-variant/30">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-md">รายละเอียดที่อยู่จัดส่ง</h2>
<form class="space-y-md" id="addressForm">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1">ชื่อ-นามสกุล</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all placeholder:text-outline-variant" placeholder="ระบุชื่อจริงและนามสกุล" type="text"/>
<span class="absolute right-md top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant text-[20px]" data-icon="person">person</span>
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1">เบอร์โทรศัพท์</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all placeholder:text-outline-variant" placeholder="08X-XXX-XXXX" type="tel"/>
<span class="absolute right-md top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant text-[20px]" data-icon="call">call</span>
</div>
</div>
<!-- Address Details -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1">บ้านเลขที่, ถนน, ซอย</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all placeholder:text-outline-variant resize-none" placeholder="ระบุเลขที่บ้าน หมู่บ้าน ถนน ซอย" rows="3"></textarea>
</div>
<!-- Province Dropdown -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1">จังหวัด</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none appearance-none transition-all">
<option value="">เลือกจังหวัด</option>
<option>กรุงเทพมหานคร</option>
<option>เชียงใหม่</option>
<option>ขอนแก่น</option>
</select>
<span class="absolute right-md top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- District & Sub-district (2-column layout for density) -->
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1">อำเภอ/เขต</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none appearance-none">
<option value="">ระบุอำเภอ</option>
</select>
<span class="absolute right-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant text-[20px] pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1">ตำบล/แขวง</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none appearance-none">
<option value="">ระบุตำบล</option>
</select>
<span class="absolute right-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant text-[20px] pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Postal Code -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1">รหัสไปรษณีย์</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all placeholder:text-outline-variant" placeholder="XXXXX" type="number"/>
</div>
</form>
</section>
<!-- Summary Preview (Small Card) -->
<div class="mt-md bg-primary/5 border border-primary/10 rounded-xl p-md flex items-center gap-md">
<div class="bg-primary-container text-on-primary-container p-2 rounded-lg">
<span class="material-symbols-outlined" data-icon="local_shipping">local_shipping</span>
</div>
<div>
<p class="font-label-md text-label-md text-primary">จัดส่งด่วน (Express)</p>
<p class="font-body-md text-body-md text-on-surface-variant">ระยะเวลา 1-3 วันทำการ</p>
</div>
</div>
</main>
<!-- Bottom Actions Container -->
<footer class="fixed bottom-0 left-0 w-full bg-surface-container-lowest shadow-[0_-4px_24px_rgba(0,0,0,0.06)] px-md py-lg z-50">
<div class="max-w-[480px] mx-auto flex gap-md">
<button class="flex-1 py-3 border border-primary text-primary font-title-lg text-title-lg rounded-xl active:scale-95 transition-all hover:bg-primary/5">
                ย้อนกลับ
            </button>
<button class="flex-[2] py-3 bg-primary-container text-on-primary-container font-title-lg text-title-lg rounded-xl shadow-lg shadow-primary-container/20 active:scale-95 transition-all flex justify-center items-center gap-sm" onclick="window.location.reload()">
<span>ถัดไป</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
<!-- Bottom Navigation Bar (Mobile Hide/Show logic from JSON) -->
<!-- Suppressed based on "Task-Focused" rule in Shell Visibility & Relevance -->
<script>
        // Simple micro-interaction for form focus
        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.classList.add('transition-transform');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Form submission prevention for demo
        document.getElementById('addressForm').addEventListener('submit', (e) => e.preventDefault());
    </script>
</body></html>
